name: "02 · Unit & E2E Tests"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Type check
        run: mypy status_page/runtime.py status_page/routes/

      - name: Run unit tests with coverage
        run: pytest tests --ignore=tests/test_e2e.py -v --cov=status_page --cov-report=term-missing --cov-fail-under=75

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          SESSION_COOKIE_SECURE: "false"
        run: pytest tests/test_e2e.py -v
