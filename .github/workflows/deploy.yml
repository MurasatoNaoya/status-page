name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    if: ${{ secrets.DEPLOY_HOST != '' && secrets.DEPLOY_USER != '' && secrets.DEPLOY_SSH_KEY != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add deploy host
        run: ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync code
        run: |
          rsync -az --delete \
            --exclude ".git" \
            --exclude ".venv" \
            --exclude "__pycache__" \
            --exclude "*.pyc" \
            --exclude ".env" \
            --exclude "*.db" \
            --exclude "data" \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}"

      - name: Restart service
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd '${{ secrets.DEPLOY_PATH }}' && sudo systemctl restart status-page && sudo systemctl is-active status-page"

      - name: Verify scheduler health
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/scheduler-health.json -w "%{http_code}" "https://${{ secrets.DEPLOY_HOST }}/api/health/scheduler")
            if [ "$code" = "200" ]; then
              cat /tmp/scheduler-health.json
              exit 0
            fi
            sleep 3
          done
          echo "Scheduler health check failed:"
          cat /tmp/scheduler-health.json || true
          exit 1
