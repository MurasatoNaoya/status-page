name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install linters
        run: pip install ruff

      - name: Ruff fix (lint + format)
        run: |
          ruff check --fix .
          ruff format .

      - name: Commit fixes if any
        if: github.event_name == 'pull_request'
        run: |
          git diff --quiet && exit 0
          git checkout "${{ github.head_ref }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: auto-fix lint and formatting (ruff)"
          git push

      - name: Fail if unfixed lint issues on main
        if: github.event_name == 'push'
        run: |
          git diff --quiet || { echo "::error::Lint issues found on main. Fix locally and push."; exit 1; }
