groups:
  - name: "Azure (UK South)"
    services:
      - name: "Azure Kubernetes Service (AKS)"
        type: http
        url: "https://mcr.microsoft.com/v2/"
        expected_status: 200
        interval: 60
        social_keywords: ["aks outage", "azure kubernetes down", "aks down"]

      - name: "Azure Container Registry (ACR)"
        type: dns
        hostname: "azurecr.io"
        interval: 60
        social_keywords: ["azure container registry down", "acr outage"]

      - name: "Azure AD / Entra ID"
        type: http
        url: "https://login.microsoftonline.com/common/v2.0/.well-known/openid-configuration"
        interval: 60
        social_keywords: ["azure outage", "azure down", "entra id down"]

      - name: "Azure Portal"
        type: http
        url: "https://portal.azure.com"
        expected_status: 200
        interval: 60

      - name: "Azure ARM API"
        type: http
        url: "https://management.azure.com/subscriptions?api-version=2020-01-01"
        expected_status: 401
        interval: 60

      - name: "Azure Blob Storage (UK South)"
        type: dns
        hostname: "uksouth.blob.core.windows.net"
        interval: 60

      - name: "Azure SQL (UK South)"
        type: dns
        hostname: "uksouth.database.windows.net"
        interval: 60

      # --- Private network (uncomment when running inside your VNet) ---
      # - name: "App DB (Private Link)"
      #   type: dns
      #   hostname: "mydb.privatelink.database.windows.net"
      #   interval: 60

      # - name: "Storage (Private Endpoint)"
      #   type: dns
      #   hostname: "mystorage.privatelink.blob.core.windows.net"
      #   interval: 60

      # - name: "Your AKS Cluster"
      #   type: tcp
      #   host: "myaks.uksouth.azmk8s.io"
      #   port: 443
      #   interval: 60

      # - name: "Your Private ACR"
      #   type: http
      #   url: "https://yourregistry.azurecr.io/v2/"
      #   expected_status: 401
      #   interval: 60

  - name: "GitHub"
    services:
      - name: "GitHub Web Pages (github.com)"
        type: http
        url: "https://github.com"
        expected_status: 200
        interval: 300
        social_keywords: ["github down", "github website down"]

      # auth_token_env: uses GITHUB_TOKEN env var for authenticated API calls (5k req/hr)
      # Personal: GITHUB_TOKEN=$(gh auth token)
      # Company: use a GitHub service account PAT instead
      - name: "GitHub API"
        type: http
        url: "https://api.github.com"
        expected_status: 200
        interval: 300
        auth_token_env: "GITHUB_TOKEN"
        social_keywords: ["github down", "github outage", "github api down"]

      - name: "GitHub Actions"
        type: http
        url: "https://api.github.com/meta"
        expected_status: 200
        interval: 300
        auth_token_env: "GITHUB_TOKEN"
        social_keywords: ["github actions down", "github actions outage"]

      - name: "GitHub Copilot"
        type: http
        url: "https://api.github.com/meta"
        expected_status: 200
        interval: 300
        auth_token_env: "GITHUB_TOKEN"
        social_keywords: ["github copilot down", "copilot outage", "copilot not working"]

  - name: "Public Container Registries"
    services:
      - name: "Docker Hub"
        type: http
        url: "https://registry-1.docker.io/v2/"
        expected_status: 401
        interval: 300
        social_keywords: ["docker hub down", "docker hub outage", "dockerhub issues"]

      - name: "Red Hat Quay.io"
        type: http
        url: "https://quay.io/api/v1/discovery"
        interval: 300
        social_keywords: ["quay.io down", "red hat registry outage"]
