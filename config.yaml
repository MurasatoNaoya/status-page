page:
  title: "Status"
  description: "Service Status"

dns_bar:
  name: "DNS Resolution"
  interval: 60
  targets:
    - hostname: "uksouth.blob.core.windows.net"
      label: "Azure Blob"
    - hostname: "uksouth.database.windows.net"
      label: "Azure SQL"
    - hostname: "azurecr.io"
      label: "ACR"
    - hostname: "login.microsoftonline.com"
      label: "Entra ID"
    - hostname: "management.azure.com"
      label: "ARM API"
    - hostname: "registry-1.docker.io"
      label: "Docker Hub"
    - hostname: "ghcr.io"
      label: "GHCR"
    - hostname: "mcr.microsoft.com"
      label: "AKS/MCR"
    # --- Uncomment for private network targets ---
    # - hostname: "mydb.privatelink.database.windows.net"
    #   label: "DB Private Link"
    # - hostname: "myaks.uksouth.azmk8s.io"
    #   label: "Your AKS Cluster"

services:
  - name: "Example API"
    type: http
    url: "https://httpbin.org/status/200"
    interval: 60

  # - name: "My Blog"
  #   type: http
  #   url: "https://myblog.com"
  #   interval: 60

  # - name: "DNS Check"
  #   type: dns
  #   hostname: "example.com"
  #   interval: 300

  # - name: "Redis"
  #   type: tcp
  #   host: "localhost"
  #   port: 6379
  #   interval: 30

  # - name: "Custom Check"
  #   type: script
  #   command: "/path/to/check.sh"
  #   interval: 120

groups:
  - name: "Azure UK South"
    services:
      - name: "Azure Status (UK South)"
        type: azure_status
        region: "UK South"
        interval: 300

      - name: "Azure Portal"
        type: http
        url: "https://portal.azure.com"
        expected_status: 200
        interval: 120

      - name: "Azure ARM API"
        type: http
        url: "https://management.azure.com/subscriptions?api-version=2020-01-01"
        expected_status: 401
        interval: 120

      - name: "Azure Blob Storage (UK South)"
        type: dns
        hostname: "uksouth.blob.core.windows.net"
        interval: 120

      - name: "Azure SQL (UK South)"
        type: dns
        hostname: "uksouth.database.windows.net"
        interval: 120

      - name: "Azure AD / Entra ID"
        type: http
        url: "https://login.microsoftonline.com/common/v2.0/.well-known/openid-configuration"
        interval: 120
        social_keywords: ["azure outage", "azure down", "entra id down"]

      - name: "AKS / Microsoft Container Registry"
        type: http
        url: "https://mcr.microsoft.com/v2/"
        expected_status: 200
        interval: 120
        social_keywords: ["aks outage", "azure kubernetes down", "aks down", "mcr down"]

      # --- Private network (uncomment when running inside your VNet) ---
      # - name: "App DB (Private Link)"
      #   type: dns
      #   hostname: "mydb.privatelink.database.windows.net"
      #   interval: 60

      # - name: "Storage (Private Endpoint)"
      #   type: dns
      #   hostname: "mystorage.privatelink.blob.core.windows.net"
      #   interval: 60

      # - name: "Your AKS Cluster"
      #   type: tcp
      #   host: "myaks.uksouth.azmk8s.io"
      #   port: 443
      #   interval: 60

      - name: "Azure Container Registry"
        type: dns
        hostname: "azurecr.io"
        interval: 120
        social_keywords: ["azure container registry down", "acr outage"]

      # - name: "Your Private ACR"
      #   type: http
      #   url: "https://yourregistry.azurecr.io/v2/"
      #   expected_status: 401
      #   interval: 60

  - name: "Public Container Registries"
    services:
      - name: "Docker Hub"
        type: http
        url: "https://registry-1.docker.io/v2/"
        expected_status: 401
        interval: 120
        social_keywords: ["docker hub down", "docker hub outage", "dockerhub issues"]

      - name: "GitHub Container Registry"
        type: http
        url: "https://ghcr.io/v2/"
        expected_status: 401
        interval: 120
        social_keywords: ["ghcr down", "github packages outage"]

      - name: "Red Hat Quay.io"
        type: http
        url: "https://quay.io/api/v1/discovery"
        interval: 120
        social_keywords: ["quay.io down", "red hat registry outage"]
