page:
  title: "Status"
  description: "Service Status"

# External status page APIs to poll for real incidents
status_feeds:
  - name: "GitHub"
    url: "https://www.githubstatus.com/api/v2"
    components:
      "Actions": "GitHub Actions"
      "Git Operations": "GitHub Web Pages (github.com)"
      "API Requests": "GitHub API"
      "Copilot": "GitHub Copilot"
    interval: 300

  - name: "Red Hat"
    url: "https://status.redhat.com/api/v2"
    components:
      "Quay.io": "Red Hat Quay.io"
    interval: 300

  - name: "Docker"
    type: statusio
    url: "https://api.status.io/1.0/status/533c6539221ae15e3f000031"
    history_url: "https://www.dockerstatus.com/pages/history/533c6539221ae15e3f000031"
    components:
      "Docker Hub Registry": "Docker Hub"
      "Docker Authentication": "Docker Hub"
      "Docker Hub Web Services": "Docker Hub"
    interval: 300

  - name: "Azure"
    type: azure_rss
    url: "https://azure.status.microsoft/en-us/status/feed/"
    history_url: "https://azure.status.microsoft/en-us/status/history/"
    # Only import incidents that are global or mention UK South
    # Skip incidents specific to other regions (West US, East US, etc.)
    exclude_regions: ["West US", "East US", "West Europe", "North Europe", "Southeast Asia", "East Asia", "Central US", "South Central US", "West US 2", "West US 3", "Government", "China"]
    # Services covered by this feed (used for bar coverage — green vs grey)
    covered_services:
      - "Azure Kubernetes Service (AKS)"
      - "Azure Container Registry (ACR)"
      - "Azure AD / Entra ID"
      - "Azure Portal"
      - "Azure ARM API"
      - "Azure Blob Storage (UK South)"
      - "Azure SQL (UK South)"
    interval: 300

  # --- Azure Service Health API (replaces RSS feed above) ---
  # Gives proper severity, lifecycle updates, and region-filtered incidents.
  # Incidents are region-based (not subscription-based), so you only need
  # ONE subscription to authenticate — any sub in your tenant will do.
  # The same "UK South" incidents appear regardless of which sub you query.
  #
  # Prerequisites:
  #   1. pip install azure-identity
  #   2. Create SPN with Reader on any one subscription:
  #        az ad sp create-for-rbac --name "status-page-reader" \
  #          --role Reader --scopes /subscriptions/<ANY_SUBSCRIPTION_ID>
  #   3. Set env vars: AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET
  # To enable: comment out the azure_rss feed above and uncomment this block.
  #
  # - name: "Azure"
  #   type: azure_service_health
  #   subscription_id: "<any-subscription-id>"
  #   region: "UK South"
  #   interval: 300

dns_bar:
  name: "DNS Resolution"
  interval: 60
  targets:
    - hostname: "uksouth.blob.core.windows.net"
      label: "Azure Blob"
    - hostname: "uksouth.database.windows.net"
      label: "Azure SQL"
    - hostname: "azurecr.io"
      label: "ACR"
    - hostname: "login.microsoftonline.com"
      label: "Entra ID"
    - hostname: "management.azure.com"
      label: "ARM API"
    - hostname: "registry-1.docker.io"
      label: "Docker Hub"
    - hostname: "ghcr.io"
      label: "GHCR"
    - hostname: "api.github.com"
      label: "GitHub API"
    - hostname: "mcr.microsoft.com"
      label: "AKS/MCR"
    # --- Uncomment for private network targets ---
    # - hostname: "mydb.privatelink.database.windows.net"
    #   label: "DB Private Link"
    # - hostname: "myaks.uksouth.azmk8s.io"
    #   label: "Your AKS Cluster"

